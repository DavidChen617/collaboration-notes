services:
  postgres:
    image: postgres:18
    container_name: todo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./src/TodoApp/Infrastructure/Persistence/Migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://todo_user:password@postgres:5432/todo_db?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

volumes:
  pgdata:
