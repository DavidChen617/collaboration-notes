apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: collaboration-notes
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/DavidChen617/collaboration-notes.git
    targetRevision: HEAD
    path: infra/k8s
    directory:
      recurse: true
      # keycloak/realm-export/conotes-realm.json 是給本機 docker-compose 掛載用的來源檔,
      # 不是 k8s manifest(沒有 kind 欄位) —— ArgoCD 遞迴掃描目錄時會把它當成
      # manifest 嘗試解析、直接讓整個 Application 的 comparison 失敗。真正給叢集用的版本是
      # keycloak/configmap-realm-import.yaml(手動保持內容同步, 見該檔案開頭的註解)。
      exclude: "keycloak/realm-export/*"

  destination:
    server: https://kubernetes.default.svc
    namespace: collaboration-notes

  # 這三個 Secret 的實際密鑰內容由伺服器端 `infra/scripts/apply-secrets.sh` 寫入,
  # 不進 git(git 裡的 stringData 只是空殼、宣告存在與 key 名稱, 見各自檔案開頭的
  # 註解)——忽略 data/stringData 差異, ArgoCD 才不會把伺服器端寫入的真實內容
  # 用 selfHeal 蓋回空殼, 也不會因為內容跟 git 不同就當成需要修的 drift。
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: conotes-secrets
      namespace: collaboration-notes
      jsonPointers:
        - /data
        - /stringData
    - group: ""
      kind: Secret
      name: postgres-credentials
      namespace: collaboration-notes
      jsonPointers:
        - /data
        - /stringData
    - group: ""
      kind: Secret
      name: keycloak-credentials
      namespace: collaboration-notes
      jsonPointers:
        - /data
        - /stringData
    - group: ""
      kind: Secret
      name: cloudflared-credentials
      namespace: collaboration-notes
      jsonPointers:
        - /data
        - /stringData

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
