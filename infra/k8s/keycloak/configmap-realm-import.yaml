# Mirrors infra/k8s/keycloak/realm-export/conotes-realm.json (the repo's
# source-of-truth export, per design.md decision #10) so Keycloak can import it
# on startup via --import-realm. Keep the two in sync.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-import
  namespace: collaboration-notes
data:
  conotes-realm.json: |
    {
      "realm": "conotes",
      "enabled": true,
      "sslRequired": "external",
      "registrationAllowed": false,
      "roles": {
        "realm": [
          {
            "name": "admin",
            "description": "系統管理者, 可以手動撤銷使用者的訂閱等級(subscription-billing change)"
          }
        ]
      },
      "clients": [
        {
          "clientId": "conotes-spa",
          "name": "CoNotes SPA",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": [
            "https://www.davish.net/conote/*",
            "http://localhost:4200/*"
          ],
          "webOrigins": [
            "https://www.davish.net",
            "http://localhost:4200"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "protocolMappers": [
            {
              "name": "audience-conotes-spa",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "conotes-spa",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ]
    }
