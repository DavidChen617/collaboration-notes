# Single replica: 2-node toy/learning cluster, no HA requirement for this change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: collaboration-notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/davidchen617/conotes-api:d01cba9e10a3687dcd91cfcdf4b3b540b2e03138
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
            # PayPal / AI provider 這類第三方密鑰——套用方式見 infra/scripts/apply-secrets.sh,
            # 不進 git、不經過 CI/CD，由伺服器端的 .env 檔案手動套用。
            - secretRef:
                name: conotes-secrets
          env:
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: app-password
            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres;Database=app;Username=conotes_app;Password=$(APP_DB_PASSWORD)
