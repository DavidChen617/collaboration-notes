# Child ArgoCD Application (app-of-apps pattern): ingress-nginx is installed from
# its official Helm chart rather than hand-copied as raw manifests, since the
# upstream project's own manifest is large (RBAC, webhook config, etc.) and is
# meant to be consumed as-is, not re-authored here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      # 這個 chart 的 admission webhook 憑證是靠 Helm pre-install hook 產生 CA、
      # patch caBundle——ArgoCD 對 Helm hook 的處理方式不同，這個 hook 沒有真的
      # 跑起來，導致 caBundle 是空的、任何 Ingress 的 CREATE/UPDATE 都會被
      # webhook 擋下(x509: certificate signed by unknown authority)。ArgoCD +
      # 這個 chart 的已知相容性問題，標準解法是直接關掉 admission webhook。
      valuesObject:
        controller:
          admissionWebhooks:
            enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
