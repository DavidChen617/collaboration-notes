# 只宣告這個 Secret 的存在與 key 名稱，不放真的密碼內容——真實內容由伺服器端
# `infra/scripts/apply-secrets.sh` 從 postgres.env 寫入。`infra/argocd/application.yaml`
# 對這個資源設定了 ignoreDifferences（忽略 data/stringData），所以 ArgoCD 只確保這個
# Secret 物件存在（新叢集 bootstrap 時會自動建出空殼），selfHeal 不會把伺服器端寫入的
# 真實內容改回去，也不會因為「git 裡有宣告」而被當成該保留的資源，不會被 prune。
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: collaboration-notes
type: Opaque
stringData:
  postgres-password: ""
  app-password: ""
  keycloak-password: ""
