# Cloudflare Tunnel ingress config (see design.md Decision 9): the tunnel now
# points at a single destination, nginx's Service, instead of one hostname
# mapping per internal Service. nginx's own Ingress rules (see
# deploy/k8s/ingress/ingress.yaml) then route by hostname to the API or Keycloak.
#
# This file documents the intended config; applying it to the live tunnel is an
# operational step (`cloudflared tunnel ...` / Cloudflare Zero Trust dashboard)
# outside this repo, not something `kubectl apply` or ArgoCD manages.
tunnel: <tunnel-id>
credentials-file: /etc/cloudflared/creds/credentials.json

ingress:
  - hostname: api.example.com
    service: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80
  - hostname: auth.example.com
    service: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80
  - service: http_status:404
