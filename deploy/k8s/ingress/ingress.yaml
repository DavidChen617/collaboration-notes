# Routes browser-facing traffic (via nginx, the cluster's single ingress point —
# see design.md Decision 9) to the API and Keycloak by hostname. Cloudflare Tunnel
# points only at nginx's Service; see deploy/cloudflared/config.yml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conotes
  namespace: collaboration-notes
spec:
  ingressClassName: nginx
  rules:
    - host: api.<domain>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
    - host: auth.<domain>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
