# Single replica by design: this is a 2-node toy/learning cluster, not a
# highly-available deployment. See design.md Risks/Trade-offs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: collaboration-notes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgres-password
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: app-password
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: keycloak-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
            defaultMode: 0755
