# Plain Deployment (not the Keycloak Operator) and single replica: this is a
# 2-node toy/learning cluster. See design.md Decision 1 and Risks/Trade-offs.
# start-dev (not start) is used for simplicity — acceptable given design.md's
# explicit non-goal of production hardening/HA for this change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: collaboration-notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args:
            - start-dev
            - --import-realm
          ports:
            - containerPort: 8080
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: conotes_keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: keycloak-password
            - name: KC_HOSTNAME
              value: https://auth.example.com
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: admin-password
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
