apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: collaboration-notes
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/DavidChen617/collaboration-notes.git
    targetRevision: HEAD
    path: deploy/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: collaboration-notes

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
