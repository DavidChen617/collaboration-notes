services:
  postgres:
    image: postgres:18
    container_name: conotes-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
      APP_PASSWORD: password
      KEYCLOAK_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./src/CoNotes.Infrastructure/Persistence/Migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://conotes_app:password@postgres:5432/app?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  redis:
    image: redis:8-alpine
    container_name: conotes-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: conotes-keycloak
    ports:
      - "8081:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: conotes_keycloak
      KC_DB_PASSWORD: password
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/k8s/keycloak/realm-export:/opt/keycloak/data/import
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
